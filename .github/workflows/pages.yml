# content/ klasöründe bir değişiklik olduğunda catalog.json'u yeniden üretip main'e commit'ler.
# Site doğrudan main dalından yayınlanır (GitHub Pages ayarı değiştirmeye gerek yok).
# Bir içerik dosyasında hata varsa bu iş kırmızı olur ve site eski kataloğu göstermeye devam eder.
name: Kataloğu güncelle

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Değiştiyse commit'le
        run: |
          if git diff --quiet -- catalog.json; then
            echo "catalog.json zaten güncel."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "Kataloğu güncelle"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
